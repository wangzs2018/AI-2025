<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>课程详情 - 学习平台示例</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body data-page="detail">
  <header class="site-header">
    <div class="logo">学习平台示例</div>
    <nav class="main-nav" aria-label="主导航">
      <ul>
        <li><a href="index.html">主页</a></li>
        <li><button id="themeToggle" aria-label="切换主题">🌓 主题</button></li>
      </ul>
    </nav>
  </header>
  <main>
    <article class="course-detail" aria-labelledby="course-title">
      <header>
        <h1 id="course-title">加载中...</h1>
        <p id="course-subtitle" class="subtitle"></p>
      </header>
      <section class="meta" aria-label="课程元信息">
        <ul>
          <li><strong>时长：</strong><span id="course-duration">--</span></li>
          <li><strong>难度：</strong><span id="course-level">--</span></li>
          <li><strong>更新：</strong><span id="course-updated">--</span></li>
        </ul>
      </section>
      <section class="description" aria-label="课程简介">
        <h2>课程简介</h2>
        <p id="course-description">正在加载课程内容...</p>
      </section>
      <section class="outline" aria-label="课程大纲">
        <h2>课程大纲</h2>
        <ol id="course-outline"></ol>
      </section>
      <nav class="back-nav">
        <a class="btn" href="index.html">← 返回课程列表</a>
      </nav>
    </article>
  </main>
  <footer class="site-footer">
    <p>&copy; 2025 学习平台示例.</p>
  </footer>
  <script src="assets/js/main.js" defer></script>
</body>
</html>
